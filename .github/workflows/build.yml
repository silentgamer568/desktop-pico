name: Build and Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch: {}

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: "6.11.*"
          host: "windows"
          target: "desktop"
          arch: "win64_msvc2022_64"
 
      - name: Set up MSVC developer environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Install Ninja
        run: winget install --id=Ninja-build.Ninja -e --disable-interactivity --accept-source-agreements --accept-package-agreements
 
      - name: Install Inno Setup
        run: winget install --id=JRSoftware.InnoSetup -e --disable-interactivity --accept-source-agreements --accept-package-agreements
 
      - name: Add WinGet-installed tools to PATH
        run: echo "$env:LOCALAPPDATA\Microsoft\WinGet\Links" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Configure CMake
        run: cmake -S . -B build -G "Ninja" -DCMAKE_BUILD_TYPE=Release -DCMAKE_PREFIX_PATH="$env:QT_ROOT_DIR"
 
      - name: Build
        run: cmake --build build

      - name: Deploy Qt runtime DLLs
        run: |
          & "$env:QT_ROOT_DIR\bin\windeployqt.exe" build\DesktopPico.exe

      - name: Build installer
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer\setup.iss

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: DesktopPico-Installer
          path: dist\DesktopPico_Setup.exe

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist\DesktopPico_Setup.exe
          generate_release_notes: true
